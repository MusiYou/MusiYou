<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>音你而创 · MusiYou</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px;
      color: #f1f5f9;
      background: #0f0a1e;
      overflow-x: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(ellipse at 15% 20%, rgba(139,92,246,0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 15%, rgba(236,72,153,0.2) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 80%, rgba(59,130,246,0.15) 0%, transparent 50%),
        #0f0a1e;
      z-index: -3;
      pointer-events: none;
    }
    .floating-note {
      position: fixed; font-size: 20px; opacity: 0.12;
      animation: floatNote 15s linear infinite;
      z-index: -1; pointer-events: none;
    }
    @keyframes floatNote {
      0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.15; }
      90% { opacity: 0.15; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }
    .container {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      max-width: 100%;
      width: 100%;
      overflow: hidden;
    }
    header {
      background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(236,72,153,0.25));
      border-bottom: 1px solid rgba(255,255,255,0.12);
      color: white; padding: 16px 16px; text-align: center;
    }
    header h1 { font-size: 22px; margin-bottom: 2px; }
    header p { font-size: 11px; opacity: 0.8; }

    .main { display: flex; gap: 12px; padding: 12px; flex-wrap: wrap; }
    .left { flex: 1; min-width: 0; }
    .right { flex: 1.5; min-width: 0; }

    h2 { font-size: 13px; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .badge { font-size: 9px; background: rgba(74,222,128,0.15); color: #4ade80; padding: 1px 6px; border-radius: 20px; border: 1px solid rgba(74,222,128,0.3); white-space: nowrap; }

    textarea {
      width: 100%; height: 100px; padding: 10px;
      border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
      font-size: 14px; resize: vertical; outline: none;
      font-family: inherit; background: rgba(255,255,255,0.05); color: #f1f5f9;
    }
    textarea::placeholder { color: rgba(148,163,184,0.5); }
    textarea:focus { border-color: #8b5cf6; }

    button {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: white; border: none; padding: 8px 14px; border-radius: 8px;
      font-size: 12px; cursor: pointer; transition: all 0.2s; margin: 2px;
      font-family: inherit; touch-action: manipulation; min-height: 36px;
    }
    button:hover { transform: translateY(-1px); }
    button:active { transform: scale(0.97); }
    button:disabled { background: #3a3a4a; cursor: not-allowed; }
    button.small { padding: 4px 8px; font-size: 10px; min-height: 28px; border-radius: 6px; }
    button.gray { background: rgba(100,116,139,0.6); }
    button.big { font-size: 14px; padding: 12px 20px; font-weight: 600; border-radius: 12px; }

    .canvas-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      max-width: 100%;
      -webkit-overflow-scrolling: touch;
    }
    canvas#editor {
      background: rgba(255,255,255,0.03);
      cursor: crosshair;
      display: block;
      touch-action: none;
      max-width: none;
    }
    .controls { display: flex; align-items: center; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
    .controls label { font-size: 11px; color: #94a3b8; white-space: nowrap; }
    .controls select {
      padding: 5px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.12);
      font-size: 11px; background: rgba(255,255,255,0.08); color: #f1f5f9; outline: none;
      max-width: 120px;
    }
    .controls select option { background: #1a1a2e; }
    .controls input[type="range"] { width: 70px; accent-color: #8b5cf6; }

    /* 多选乐器复选框 */
    .instrument-checkboxes {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .inst-checkbox {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
      background: rgba(255,255,255,0.05);
      white-space: nowrap;
    }
    .inst-checkbox.checked {
      background: rgba(139,92,246,0.35);
      border-color: #8b5cf6;
    }
    .inst-checkbox input[type="checkbox"] { display: none; }

    #status { font-size: 10px; color: #94a3b8; margin-left: auto; }
    .help { font-size: 10px; color: #94a3b8; margin-top: 4px; }
    #info { font-size: 11px; color: #94a3b8; margin-top: 6px; white-space: pre-line; min-height: 14px; }

    .panel { border-radius: 10px; padding: 10px 12px; margin: 6px 10px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); }
    .panel-style { background: rgba(245,158,11,0.06); border-color: rgba(245,158,11,0.2); }
    .panel-record { background: rgba(59,130,246,0.06); border-color: rgba(59,130,246,0.2); }
    .panel-share { background: rgba(139,92,246,0.06); border-color: rgba(139,92,246,0.2); }

    .lyrics-preview {
      margin-top: 8px; background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
      padding: 8px; max-height: 150px; overflow-y: auto;
    }
    .sentence-item { display: flex; align-items: center; margin-bottom: 4px; }
    .sentence-btn {
      background: #8b5cf6; color: white; border: none; padding: 2px 8px;
      border-radius: 4px; font-size: 10px; cursor: pointer; margin-right: 6px; flex-shrink: 0;
    }
    .sentence-text { font-size: 12px; display: flex; flex-wrap: wrap; }
    .sentence-text span { padding: 1px 2px; border-radius: 3px; transition: all 0.2s; }
    .sentence-text span.highlight { background: #fbbf24; color: #000; font-weight: 600; box-shadow: 0 0 10px rgba(251,191,36,0.5); }

    .progress-bar { width: 100%; height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-top: 8px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #8b5cf6, #ec4899, #f59e0b); border-radius: 3px; width: 0%; transition: width 0.08s linear; }

    .fullscreen-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0515 70%, #050208 100%);
      z-index: 9999; justify-content: center; align-items: center; flex-direction: column;
    }
    .fullscreen-overlay.active { display: flex; }
    .fullscreen-lyrics { font-size: 22px; color: #fff; text-align: center; max-width: 85%; line-height: 2; }
    .fullscreen-lyrics span { padding: 4px 8px; border-radius: 8px; transition: all 0.25s; }
    .fullscreen-lyrics span.highlight { background: #fbbf24; color: #000; font-weight: 700; font-size: 1.25em; }

    /* 移动端优化 */
    @media (max-width: 600px) {
      body { padding: 4px; }
      .container { border-radius: 10px; }
      header { padding: 10px 10px; }
      header h1 { font-size: 18px; }
      header p { font-size: 10px; }
      .main { padding: 8px; gap: 8px; flex-direction: column; }
      .left, .right { min-width: 0; width: 100%; }
      h2 { font-size: 12px; }
      textarea { height: 80px; font-size: 13px; padding: 8px; }
      button { padding: 7px 10px; font-size: 11px; min-height: 32px; }
      button.big { font-size: 13px; padding: 10px 16px; }
      .controls { gap: 3px; }
      .controls select { font-size: 10px; padding: 4px 6px; max-width: 100px; }
      .controls input[type="range"] { width: 55px; }
      .panel { padding: 8px 10px; margin: 4px 6px; }
      .inst-checkbox { font-size: 9px; padding: 3px 6px; }
      .lyrics-preview { max-height: 100px; }
      .fullscreen-lyrics { font-size: 18px; }
      .canvas-scroll { border-radius: 8px; }
    }
    @media (min-width: 601px) and (max-width: 900px) {
      .main { flex-direction: column; }
      .left, .right { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="floating-note" style="left:3%; animation-delay:0s;">🎵</div>
  <div class="floating-note" style="left:12%; animation-delay:2s;">🎶</div>
  <div class="floating-note" style="left:25%; animation-delay:4s;">🎵</div>
  <div class="floating-note" style="left:38%; animation-delay:1s;">🎶</div>
  <div class="floating-note" style="left:50%; animation-delay:3s;">🎵</div>
  <div class="floating-note" style="left:65%; animation-delay:5s;">🎶</div>
  <div class="floating-note" style="left:78%; animation-delay:2.5s;">🎵</div>
  <div class="floating-note" style="left:90%; animation-delay:4.5s;">🎶</div>

  <div class="container">
    <header>
      <h1>🎵 音你而创 · MusiYou</h1>
      <p>凭感觉创作，专业处理自动完成</p>
    </header>

    <div class="main">
      <div class="left">
        <h2>1. 写歌词</h2>
        <textarea id="lyrics" placeholder="输入歌词，标点分隔句子。&#10;例如：今天的风很轻，吹过我的窗前"></textarea>
        <button id="applyLyrics">✨ 应用歌词</button>
        <p id="info"></p>
        <h2 style="margin-top:8px;">📝 歌词预览 <span class="badge">点▶试听</span></h2>
        <div class="lyrics-preview" id="lyricsPreview"></div>
      </div>

      <div class="right">
        <h2>2. 调旋律 <span class="badge">自动防跑调</span> <span class="badge">画布可滑动</span></h2>
        <div class="canvas-scroll">
          <canvas id="editor" height="320"></canvas>
        </div>
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="controls">
          <button id="playBtn">▶ 播放</button>
          <button id="stopBtn" disabled>⏹ 停止</button>
          <button class="gray" id="undoBtn" disabled>↩ 撤销</button>
          <button class="gray" id="clearBtn">清空</button>
          <label>乐器：</label>
          <select id="melodyInstrument"></select>
          <label>BPM：</label>
          <input type="range" id="bpm" min="60" max="160" step="1" value="110">
          <span id="bpmValue" style="font-size:10px;">110</span>
          <button class="small" id="fullscreenBtn">🖥 全屏</button>
          <span id="status">就绪</span>
        </div>
        <p class="help">画布可左右滑动 | 点击添加音符 | 上下拖拽调音高 | 拖右边缘调时长 | 双击试听 | 右键删除</p>
      </div>
    </div>

    <div class="panel panel-style">
      <h2>3. 选风格 <span class="badge">自动配和弦+编曲</span></h2>
      <div class="controls">
        <label>风格：</label>
        <select id="accompStyle">
          <option value="pop">流行</option>
          <option value="folk">民谣</option>
          <option value="electronic">电子</option>
          <option value="rock">摇滚</option>
          <option value="jazz">爵士</option>
          <option value="chinese">古风</option>
        </select>
        <label>伴奏音量：</label>
        <input type="range" id="accompVolume" min="0" max="1" step="0.05" value="0.3">
        <span id="accompVolumeValue" style="font-size:10px;">0.3</span>
      </div>
      <h2 style="margin-top:8px;">🎸 伴奏乐器（可多选）</h2>
      <div class="instrument-checkboxes" id="accompInstruments"></div>
      <div class="controls" style="margin-top:6px;">
        <label>👤 演唱声音：</label>
        <select id="vocalSource">
          <option value="female">虚拟女声</option>
          <option value="male">虚拟男声</option>
          <option value="user">我的录音（需先录音）</option>
        </select>
        <span style="font-size:10px;color:#94a3b8;">未录音时用虚拟人声</span>
      </div>
    </div>

    <div class="panel panel-record">
      <h2>4. 录你的声音 <span class="badge">自动降噪/修音/混音</span></h2>
      <div class="controls">
        <button id="startRecordBtn">🎤 开始录音</button>
        <button id="stopRecordBtn" disabled>⏹ 停止</button>
        <button id="playRecordBtn" disabled>▶ 试听</button>
        <span id="recordStatus" style="font-size:11px;color:#94a3b8;">未录音</span>
      </div>
    </div>

    <div class="panel panel-share">
      <h2>5. 播放 & 分享</h2>
      <div class="controls">
        <button class="big" id="playFullBtn">▶ 播放完整歌曲</button>
        <button id="shareBtn">🔗 分享链接</button>
        <span id="shareStatus" style="font-size:10px;color:#94a3b8;"></span>
      </div>
    </div>
  </div>

  <div class="fullscreen-overlay" id="fullscreenOverlay">
    <div class="fullscreen-lyrics" id="fullscreenLyrics"></div>
    <button style="margin-top:20px;" id="closeFullscreen">✕ 关闭</button>
  </div>

  <script>
    'use strict';

    // ==================== 乐器库 ====================
    const INSTRUMENTS = {
      piano:{name:'钢琴',type:'poly',harmonics:[1,0.5,0.3,0.15],env:{a:0.01,d:0.3,s:0.2,r:0.5}},
      epiano:{name:'电钢琴',type:'poly',harmonics:[1,0.3,0.1,0.05],env:{a:0.005,d:0.5,s:0.1,r:0.3}},
      guitar:{name:'吉他',type:'pluck',harmonics:[1,0.8,0.4,0.2],env:{a:0.005,d:0.4,s:0.05,r:0.2}},
      bass:{name:'贝斯',type:'sine',harmonics:[1,0.3],env:{a:0.01,d:0.3,s:0.4,r:0.3}},
      violin:{name:'小提琴',type:'sawtooth',harmonics:[1,0.6,0.3,0.1],env:{a:0.2,d:0.3,s:0.5,r:0.5}},
      cello:{name:'大提琴',type:'sawtooth',harmonics:[1,0.5,0.25],env:{a:0.3,d:0.4,s:0.5,r:0.8}},
      flute:{name:'长笛',type:'sine',harmonics:[1,0.2],env:{a:0.1,d:0.1,s:0.7,r:0.3}},
      sax:{name:'萨克斯',type:'sawtooth',harmonics:[1,0.7,0.4,0.2],env:{a:0.05,d:0.2,s:0.6,r:0.4}},
      trumpet:{name:'小号',type:'sawtooth',harmonics:[1,0.8,0.5,0.2],env:{a:0.03,d:0.15,s:0.7,r:0.2}},
      organ:{name:'风琴',type:'square',harmonics:[1,0.5,0.3],env:{a:0.1,d:0.1,s:0.8,r:0.1}},
      synth:{name:'电子合成',type:'sawtooth',harmonics:[1,0.6,0.3,0.2],env:{a:0.02,d:0.2,s:0.4,r:0.2}},
      musicbox:{name:'八音盒',type:'sine',harmonics:[1,0.1],env:{a:0.005,d:1.5,s:0,r:0.1}},
      strings:{name:'弦乐',type:'sawtooth',harmonics:[1,0.7,0.4,0.2,0.1],env:{a:0.3,d:0.5,s:0.6,r:0.8}},
      choir:{name:'合唱',type:'sawtooth',harmonics:[1,0.4,0.2,0.1],env:{a:0.4,d:0.5,s:0.5,r:0.8}},
      steelguitar:{name:'钢弦吉他',type:'pluck',harmonics:[1,0.6,0.3,0.1],env:{a:0.005,d:0.6,s:0.02,r:0.3}},
      harmonica:{name:'口琴',type:'square',harmonics:[1,0.5,0.3],env:{a:0.05,d:0.2,s:0.4,r:0.3}},
      bell:{name:'铃铛',type:'sine',harmonics:[1,0.3,0.1],env:{a:0.001,d:2,s:0,r:0.5}},
      clarinet:{name:'单簧管',type:'square',harmonics:[1,0.6,0.2],env:{a:0.05,d:0.15,s:0.6,r:0.3}},
      oboe:{name:'双簧管',type:'sawtooth',harmonics:[1,0.5,0.2],env:{a:0.08,d:0.2,s:0.5,r:0.3}},
      frenchhorn:{name:'圆号',type:'sawtooth',harmonics:[1,0.6,0.3],env:{a:0.1,d:0.3,s:0.6,r:0.4}},
      harp:{name:'竖琴',type:'pluck',harmonics:[1,0.5,0.2,0.1],env:{a:0.01,d:1.2,s:0,r:0.5}},
    };
    const INSTRUMENT_KEYS = Object.keys(INSTRUMENTS);

    const VOCAL_FORMANTS = {
      female: { f1:800, f2:2000, f3:3000, q1:10, q2:12, q3:14 },
      male: { f1:500, f2:1500, f3:2500, q1:8, q2:10, q3:12 },
    };

    const CHORD_MAP = {
      'C':[48,52,55], 'G':[43,47,50], 'Am':[45,48,52], 'F':[41,45,48],
      'Dm':[38,41,45], 'Em':[40,43,47], 'E':[40,44,47], 'A':[45,48,52]
    };
    const STYLE_CONFIG = {
      pop:{pattern:'full',subdivision:1,drum:true},
      folk:{pattern:'arpeggio',subdivision:2,drum:false},
      electronic:{pattern:'full',subdivision:2,drum:true},
      rock:{pattern:'accent',subdivision:1,drum:true},
      jazz:{pattern:'swing',subdivision:1,drum:true},
      chinese:{pattern:'arpeggio',subdivision:2,drum:false},
    };

    // ==================== 全局状态 ====================
    const SCALE = [60,62,64,65,67,69,71,72,74,76,77,79,81,83,84];
    let notes = [];
    let lyricsChars = [];
    let sentences = [];
    let selectedNoteIndex = -1;
    let isDragging = false;
    let isResizing = false;
    let resizeNoteIndex = -1;
    let undoStack = [];
    let currentPlayingIndex = -1;
    let playToken = 0;
    let audioCtx = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let autoTunedBuffer = null;
    let autoChords = [];
    let activeSources = [];
    let selectedAccompInstruments = ['guitar']; // 默认选中吉他

    const canvas = document.getElementById('editor');
    const ctx = canvas.getContext('2d');
    const NOTE_H = 22;
    const NOTE_GAP = 2;
    const DUR_PX = 70; // 移动端更紧凑
    const TOP_PAD = 26;
    const LEFT_PAD = 40;
    const BOT_PAD = 14;
    const MIN_CANVAS_WIDTH = 600; // 最小画布宽度

    // ==================== 工具函数 ====================
    function midiToFreq(m) { return 440 * Math.pow(2, (m-69)/12); }
    function getBPM() { return parseInt(document.getElementById('bpm').value); }
    function getBeatDur() { return 60 / getBPM(); }
    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function resizeCanvas() {
      const neededWidth = notes.length > 0 ? totalWidth() + 80 : MIN_CANVAS_WIDTH;
      canvas.width = Math.max(MIN_CANVAS_WIDTH, Math.ceil(neededWidth));
      draw();
    }

    function snapMidi(y) {
      const minM = SCALE[0], maxM = SCALE[SCALE.length-1];
      const usableH = canvas.height - TOP_PAD - BOT_PAD;
      const rawMidi = maxM - (y / usableH) * (maxM - minM);
      let closest = SCALE[0], minDist = Infinity;
      for (const m of SCALE) {
        const d = Math.abs(m - rawMidi);
        if (d < minDist) { minDist = d; closest = m; }
      }
      return closest;
    }
    function midiToY(m) {
      const minM = SCALE[0], maxM = SCALE[SCALE.length-1];
      const usableH = canvas.height - TOP_PAD - BOT_PAD;
      return TOP_PAD + (maxM - m) * (usableH / (maxM - minM));
    }
    function noteX(i) {
      let x = LEFT_PAD;
      for (let j = 0; j < i; j++) x += notes[j].duration * DUR_PX + NOTE_GAP;
      return x;
    }
    function totalWidth() {
      if (notes.length === 0) return LEFT_PAD;
      return noteX(notes.length-1) + notes[notes.length-1].duration * DUR_PX;
    }
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.clientX !== undefined ? e.clientX : e.touches[0].clientX;
      const cy = e.clientY !== undefined ? e.clientY : e.touches[0].clientY;
      return { x: (cx - rect.left) * (canvas.width / rect.width), y: (cy - rect.top) * (canvas.height / rect.height) };
    }
    function findNoteAt(x, y) {
      for (let i = notes.length-1; i >= 0; i--) {
        const nx = noteX(i), ny = midiToY(notes[i].midi), nw = notes[i].duration * DUR_PX;
        if (x >= nx && x <= nx+nw && y >= ny-NOTE_H/2 && y <= ny+NOTE_H/2) return i;
      }
      return -1;
    }
    function isOnResizeHandle(x, y) {
      for (let i = notes.length-1; i >= 0; i--) {
        const nx = noteX(i), ny = midiToY(notes[i].midi), nw = notes[i].duration * DUR_PX;
        if (x >= nx+nw-6 && x <= nx+nw+3 && y >= ny-NOTE_H/2 && y <= ny+NOTE_H/2) return i;
      }
      return -1;
    }

    // ==================== 多选伴奏乐器 ====================
    function renderInstrumentCheckboxes() {
      const container = document.getElementById('accompInstruments');
      container.innerHTML = '';
      INSTRUMENT_KEYS.forEach(key => {
        const label = document.createElement('label');
        label.className = 'inst-checkbox';
        if (selectedAccompInstruments.includes(key)) label.classList.add('checked');
        label.innerHTML = `<input type="checkbox" value="${key}" ${selectedAccompInstruments.includes(key) ? 'checked' : ''}> ${INSTRUMENTS[key].name}`;
        label.addEventListener('click', () => {
          const idx = selectedAccompInstruments.indexOf(key);
          if (idx >= 0) {
            if (selectedAccompInstruments.length > 1) {
              selectedAccompInstruments.splice(idx, 1);
              label.classList.remove('checked');
            } else {
              alert('请至少选择一种伴奏乐器');

            }
          } else {
            selectedAccompInstruments.push(key);
            label.classList.add('checked');
          }

        container.appendChild(label);
      });
    }

    // ==================== 绘图 ====================
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0f0a1e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 0.5;
      ctx.font = '9px sans-serif';
      ctx.fillStyle = 'rgba(148,163,184,0.5)';
      ctx.textAlign = 'right';
      for (const m of SCALE) {
        const y = midiToY(m);
        ctx.beginPath(); ctx.moveTo(LEFT_PAD, y); ctx.lineTo(canvas.width-6, y); ctx.stroke();
        ctx.fillText(m, LEFT_PAD-6, y+3);
      }
      ctx.fillStyle = 'rgba(148,163,184,0.5)';
      ctx.textAlign = 'left';
      ctx.fillText('时间 →', LEFT_PAD, canvas.height-3);
      notes.forEach((note, i) => {
        const x = noteX(i), y = midiToY(note.midi), w = note.duration * DUR_PX;
        let color = `hsl(${((note.midi-SCALE[0])/(SCALE[SCALE.length-1]-SCALE[0]))*260}, 70%, 60%)`;
        if (i === currentPlayingIndex) color = '#fbbf24';
        else if (i === selectedNoteIndex) color = '#93c5fd';
        ctx.fillStyle = color;
        ctx.shadowBlur = (i === selectedNoteIndex || i === currentPlayingIndex) ? 10 : 3;
        ctx.shadowColor = color;
        ctx.fillRect(x, y-NOTE_H/2, w, NOTE_H);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 0.6;
        ctx.strokeRect(x, y-NOTE_H/2, w, NOTE_H);
        if (lyricsChars[i] && w > 14) {
          ctx.fillStyle = '#fff';
          ctx.font = '10px "PingFang SC","Microsoft YaHei",sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(lyricsChars[i], x+w/2, y);
        }
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillRect(x+w-3, y-NOTE_H/2, 3, NOTE_H);
      });
      document.getElementById('status').textContent = `音符：${notes.length}`;
      document.getElementById('undoBtn').disabled = undoStack.length === 0;
    }

    // ==================== 自动和弦分析 ====================
    function analyzeChords(notesArray, beatsPerBar = 4) {
      if (!notesArray.length) return ['C','G','Am','F'];
      const result = [];
      let barNotes = [];
      let beatAccum = 0;
      for (const note of notesArray) {
        barNotes.push(note.midi);
        beatAccum += note.duration;
        if (beatAccum >= beatsPerBar) {
          result.push(pickBestChord(barNotes));
          barNotes = [];
          beatAccum = 0;
        }
      }
      if (barNotes.length > 0) result.push(pickBestChord(barNotes));
      return result.length ? result : ['C','G','Am','F'];
    }
    function pickBestChord(midiNotes) {
      if (!midiNotes.length) return 'C';
      let best = 'C', bestScore = -Infinity;
      for (const chordName of Object.keys(CHORD_MAP)) {
        const chordPitches = CHORD_MAP[chordName].map(m => m % 12);
        let score = 0;
        midiNotes.forEach((midi, idx) => {
          const pc = midi % 12;
          if (chordPitches.includes(pc)) score += 2;
          if (idx < 2) score += 1;
        });
        if (score > bestScore) { bestScore = score; best = chordName; }
      }
      return best;
    }

    // ==================== 虚拟人声 ====================
    function createVirtualVocal(ctx, gender, freq, duration, startTime, vol = 0.4) {
      const formants = VOCAL_FORMANTS[gender] || VOCAL_FORMANTS.female;
      const master = ctx.createGain();
      master.gain.setValueAtTime(0, startTime);
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.value = freq;
      const f1 = ctx.createBiquadFilter();
      f1.type = 'bandpass'; f1.frequency.value = formants.f1; f1.Q.value = formants.q1;
      const f2 = ctx.createBiquadFilter();
      f2.type = 'bandpass'; f2.frequency.value = formants.f2; f2.Q.value = formants.q2;
      const f3 = ctx.createBiquadFilter();
      f3.type = 'bandpass'; f3.frequency.value = formants.f3; f3.Q.value = formants.q3;
      osc.connect(f1); f1.connect(f2); f2.connect(f3); f3.connect(master);
      master.gain.linearRampToValueAtTime(vol, startTime + 0.05);
      master.gain.setValueAtTime(vol, startTime + duration - 0.03);
      master.gain.linearRampToValueAtTime(0, startTime + duration + 0.1);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.15);
      return master;
    }

    // ==================== 自动音高修正 ====================
    function detectPitchYIN(audioData, sampleRate) {
      const frameSize = 2048, hopSize = 1024;
      const numFrames = Math.floor((audioData.length - frameSize) / hopSize);
      const pitches = [];
      const threshold = 0.15;
      for (let f = 0; f < numFrames; f++) {
        const start = f * hopSize;
        const frame = new Float32Array(frameSize);
        for (let i = 0; i < frameSize; i++) frame[i] = audioData[start+i];
        const minLag = Math.floor(sampleRate / 1000);
        const maxLag = Math.floor(sampleRate / 60);
        const diff = new Float32Array(maxLag + 1);
        let cmnd = 1;
        for (let tau = 1; tau <= maxLag; tau++) {
          let sum = 0;
          for (let i = 0; i < frameSize - tau; i++) {
            const d = frame[i] - frame[i+tau];
            sum += d * d;
          }
          diff[tau] = sum;
          if (tau >= minLag && diff[tau] < cmnd) cmnd = diff[tau];
        }
        let found = false;
        for (let tau = minLag; tau <= maxLag; tau++) {
          if (diff[tau] < threshold * cmnd) {
            if (tau > 1 && tau < maxLag) {
              const s0 = diff[tau-1], s1 = diff[tau], s2 = diff[tau+1];
              const denom = s0 - 2*s1 + s2;
              if (denom > 0) {
                const frac = (s0 - s2) / (2 * denom);
                const refinedTau = tau + frac;
                if (refinedTau > 0) {
                  pitches.push(sampleRate / refinedTau);
                  found = true; break;
                }
              }
            }
            pitches.push(sampleRate / tau);
            found = true; break;
          }
        }
        if (!found) pitches.push(0);
      }
      return pitches;
    }
    function freqToMidi(freq) {
      if (freq <= 0) return -1;
      return Math.round(12 * Math.log2(freq / 440) + 69);
    }
    function autoTuneAudio(audioData, sampleRate, targetMidi, toleranceCents = 40) {
      const pitches = detectPitchYIN(audioData, sampleRate);
      const hopSize = 1024;
      const output = new Float32Array(audioData.length);
      for (let f = 0; f < pitches.length; f++) {
        const start = f * hopSize;
        const end = Math.min(start + hopSize, audioData.length);
        const block = audioData.slice(start, end);
        const freq = pitches[f];
        if (freq > 0) {
          const currentMidi = freqToMidi(freq);
          if (currentMidi > 0) {
            const cents = (targetMidi - currentMidi) * 100;
            if (Math.abs(cents) > toleranceCents) {
              const rate = midiToFreq(targetMidi) / freq;
              const newLen = Math.floor(block.length / rate);
              for (let i = 0; i < newLen && i < block.length; i++) {
                const srcIdx = Math.floor(i * rate);
                if (start + i < output.length) output[start+i] = block[srcIdx];
              }
              continue;
            }
          }
        }
        for (let i = 0; i < block.length && start + i < output.length; i++) {
          output[start+i] = block[i];
        }
      }
      return output;
    }

    // ==================== 谱减法降噪 ====================
    function fft(re, im) {
      const N = re.length;
      if (N <= 1) return { re, im };
      const half = N / 2;
      const evenRe = new Array(half), evenIm = new Array(half), oddRe = new Array(half), oddIm = new Array(half);
      for (let i = 0; i < half; i++) {
        evenRe[i] = re[2*i]; evenIm[i] = im[2*i];
        oddRe[i] = re[2*i+1]; oddIm[i] = im[2*i+1];
      }
      const even = fft(evenRe, evenIm), odd = fft(oddRe, oddIm);
      const outRe = new Array(N), outIm = new Array(N);
      for (let k = 0; k < half; k++) {
        const angle = -2 * Math.PI * k / N;
        const cos = Math.cos(angle), sin = Math.sin(angle);
        const tRe = odd.re[k]*cos - odd.im[k]*sin;
        const tIm = odd.re[k]*sin + odd.im[k]*cos;
        outRe[k] = even.re[k] + tRe; outIm[k] = even.im[k] + tIm;
        outRe[k+half] = even.re[k] - tRe; outIm[k+half] = even.im[k] - tIm;
      }
      return { re: outRe, im: outIm };
    }
    function ifft(re, im) {
      const N = re.length;
      const out = fft(re, im.map(v => -v));
      return { re: out.re.map(v => v/N), im: out.im.map(v => -v/N) };
    }
    function spectralSubtraction(input, strength = 0.6) {
      const frameSize = 2048, hopSize = 1024;
      const numFrames = Math.floor((input.length - frameSize) / hopSize) + 1;
      if (numFrames < 2) return input.slice();
      const output = new Float32Array(input.length);
      const wnd = new Float32Array(frameSize);
      for (let i = 0; i < frameSize; i++) wnd[i] = 0.54 - 0.46 * Math.cos(2*Math.PI*i/(frameSize-1));
      const noiseFrames = Math.min(5, numFrames);
      const noiseMagSum = new Float32Array(frameSize);
      for (let f = 0; f < noiseFrames; f++) {
        const start = f * hopSize;
        const frame = new Float32Array(frameSize);
        for (let i = 0; i < frameSize; i++) frame[i] = input[start+i] * wnd[i];
        const spec = fft(Array.from(frame), new Array(frameSize).fill(0));
        for (let i = 0; i < frameSize; i++) noiseMagSum[i] += Math.hypot(spec.re[i], spec.im[i]);
      }
      const noiseMag = new Float32Array(frameSize);
      for (let i = 0; i < frameSize; i++) noiseMag[i] = noiseMagSum[i] / noiseFrames;
      const weight = new Float32Array(input.length);
      for (let f = 0; f < numFrames; f++) {
        const start = f * hopSize;
        const frame = new Float32Array(frameSize);
        for (let i = 0; i < frameSize; i++) frame[i] = input[start+i] * wnd[i];
        const spec = fft(Array.from(frame), new Array(frameSize).fill(0));
        const mag = new Float32Array(frameSize), phase = new Float32Array(frameSize);
        for (let i = 0; i < frameSize; i++) {
          mag[i] = Math.hypot(spec.re[i], spec.im[i]);
          phase[i] = Math.atan2(spec.im[i], spec.re[i]);
        }
        for (let i = 0; i < frameSize; i++) {
          mag[i] = Math.max(mag[i] - strength * noiseMag[i], 0);
        }
        const re = new Float32Array(frameSize), im = new Float32Array(frameSize);
        for (let i = 0; i < frameSize; i++) {
          re[i] = mag[i] * Math.cos(phase[i]);
          im[i] = mag[i] * Math.sin(phase[i]);
        }
        const td = ifft(Array.from(re), Array.from(im));
        for (let i = 0; i < frameSize; i++) {
          output[start+i] += td.re[i] * wnd[i];
          weight[start+i] += wnd[i] * wnd[i];
        }
      }
      for (let i = 0; i < output.length; i++) {
        if (weight[i] > 0.0001) output[i] /= weight[i];
      }
      return output;
    }

    // ==================== 自动混音链 ====================
    function createAutoMixChain(ctx, sourceNode) {
      let current = sourceNode;
      const lowcut = ctx.createBiquadFilter();
      lowcut.type = 'highpass'; lowcut.frequency.value = 80; lowcut.Q.value = 0.7;
      current.connect(lowcut); current = lowcut;
      const presence = ctx.createBiquadFilter();
      presence.type = 'peaking'; presence.frequency.value = 2500; presence.gain.value = 3; presence.Q.value = 1;
      current.connect(presence); current = presence;
      const highcut = ctx.createBiquadFilter();
      highcut.type = 'lowpass'; highcut.frequency.value = 12000;
      current.connect(highcut); current = highcut;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -24; comp.ratio.value = 4;
      comp.attack.value = 0.005; comp.release.value = 0.15;
      current.connect(comp); current = comp;
      const reverb = ctx.createConvolver();
      const rate = ctx.sampleRate;
      const irLen = Math.floor(rate * 1.5);
      const ir = ctx.createBuffer(2, irLen, rate);
      for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        for (let i = 0; i < irLen; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/irLen, 3);
      }
      reverb.buffer = ir;
      const dry = ctx.createGain(); dry.gain.value = 0.75;
      const wet = ctx.createGain(); wet.gain.value = 0.25;
      current.connect(dry); current.connect(reverb); reverb.connect(wet);
      const mixGain = ctx.createGain();
      dry.connect(mixGain); wet.connect(mixGain);
      return mixGain;
    }

    // ==================== 合成乐器 ====================
    function createInstrumentSound(ctx, key, freq, duration, startTime, vol = 0.3) {
      const inst = INSTRUMENTS[key];
      if (!inst) return null;
      const master = ctx.createGain();
      master.gain.setValueAtTime(0, startTime);
      const makeOsc = (type, f, hGain) => {
        const o = ctx.createOscillator();
        o.type = type; o.frequency.value = f;
        const g = ctx.createGain(); g.gain.value = hGain;
        o.connect(g); g.connect(master);
        o.start(startTime); o.stop(startTime + duration + 0.5);
      };
      makeOsc(inst.type, freq, 1);
      for (let i = 1; i < inst.harmonics.length; i++) {
        makeOsc(inst.type, freq * (i+1), inst.harmonics[i]);
      }
      const env = inst.env;
      master.gain.linearRampToValueAtTime(vol, startTime + env.a);
      master.gain.linearRampToValueAtTime(vol * env.s, startTime + env.a + env.d);
      master.gain.setValueAtTime(vol * env.s, startTime + duration - 0.02);
      master.gain.linearRampToValueAtTime(0, startTime + duration + env.r);
      return master;
    }

    // ==================== 鼓组 ====================
    function createDrum(ctx, type, startTime, vol = 0.25) {
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, startTime);
      if (type === 'kick') {
        const o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.setValueAtTime(120, startTime);
        o.frequency.exponentialRampToValueAtTime(40, startTime + 0.1);
        g.gain.linearRampToValueAtTime(vol, startTime);
        g.gain.exponentialRampToValueAtTime(0.001, startTime + 0.15);
        o.connect(g); o.start(startTime); o.stop(startTime + 0.2);
      } else if (type === 'snare') {
        const bufSize = ctx.sampleRate * 0.2;
        const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) d[i] = (Math.random()*2-1) * (1 - i/bufSize);
        const src = ctx.createBufferSource(); src.buffer = buf;
        g.gain.linearRampToValueAtTime(vol * 0.5, startTime);
        g.gain.exponentialRampToValueAtTime(0.001, startTime + 0.2);
        src.connect(g); src.start(startTime); src.stop(startTime + 0.2);
      } else {
        const bufSize = ctx.sampleRate * 0.08;
        const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) d[i] = (Math.random()*2-1) * (1 - i/bufSize);
        const src = ctx.createBufferSource(); src.buffer = buf;
        const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
        g.gain.linearRampToValueAtTime(vol * 0.12, startTime);
        g.gain.exponentialRampToValueAtTime(0.001, startTime + 0.05);
        src.connect(hp); hp.connect(g); src.start(startTime); src.stop(startTime + 0.1);
      }
      g.connect(ctx.destination);
    }

    // ==================== 播放引擎 ====================
    async function ensureAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();
      return audioCtx;
    }
    function stopAllPlayback() {
      activeSources.forEach(s => { try { s.stop(); } catch(e){} });
      activeSources = [];
      currentPlayingIndex = -1;
      clearHighlight();
      document.getElementById('progressFill').style.width = '0%';
      draw();
    }
    function clearHighlight() {
      document.querySelectorAll('.sentence-text span, .fullscreen-lyrics span').forEach(s => s.classList.remove('highlight'));
    }
    function highlightChar(idx) {
      clearHighlight();
      const t1 = document.querySelector(`.sentence-text span[data-idx="${idx}"]`);
      const t2 = document.querySelector(`.fullscreen-lyrics span[data-idx="${idx}"]`);
      if (t1) { t1.classList.add('highlight'); t1.scrollIntoView({ block:'nearest', behavior:'smooth' }); }
      if (t2) t2.classList.add('highlight');
    }

    async function playNotesRange(sIdx, eIdx) {
      stopAllPlayback();
      await ensureAudioCtx();
      const token = ++playToken;
      const beatDur = getBeatDur();
      const startTime = audioCtx.currentTime;
      const inst = document.getElementById('melodyInstrument').value;
      let timeOffset = 0;
      for (let i = sIdx; i <= eIdx; i++) {
        const note = notes[i];
        const output = createInstrumentSound(audioCtx, inst, midiToFreq(note.midi), note.duration * beatDur, startTime + timeOffset, 0.35);
        if (output) output.connect(audioCtx.destination);
        currentPlayingIndex = i;
        draw();
        highlightChar(i);
        timeOffset += note.duration * beatDur;
      }
      const totalDur = timeOffset;
      const progInt = setInterval(() => {
        if (token !== playToken) { clearInterval(progInt); return; }
        const elapsed = audioCtx.currentTime - startTime;
        document.getElementById('progressFill').style.width = Math.min((elapsed/totalDur)*100, 100) + '%';
        if (elapsed > totalDur + 0.5) {
          clearInterval(progInt);
          currentPlayingIndex = -1;
          draw();
          clearHighlight();
          document.getElementById('progressFill').style.width = '0%';
        }
      }, 80);
      document.getElementById('status').textContent = '播放中...';
    }

    async function playFullSong() {
      if (notes.length === 0) return;
      stopAllPlayback();
      await ensureAudioCtx();
      const token = ++playToken;
      const beatDur = getBeatDur();
      const startTime = audioCtx.currentTime;
      const melodyInst = document.getElementById('melodyInstrument').value;
      const accompInsts = selectedAccompInstruments.length > 0 ? selectedAccompInstruments : ['guitar'];
      const styleName = document.getElementById('accompStyle').value;
      const accompVol = parseFloat(document.getElementById('accompVolume').value);
      const vocalSource = document.getElementById('vocalSource').value;
      const styleCfg = STYLE_CONFIG[styleName];

      autoChords = analyzeChords(notes);

      // 旋律
      let timeOffset = 0;
      notes.forEach((note) => {
        const output = createInstrumentSound(audioCtx, melodyInst, midiToFreq(note.midi), note.duration * beatDur, startTime + timeOffset, 0.25);
        if (output) output.connect(audioCtx.destination);
        timeOffset += note.duration * beatDur;
      });

      // 伴奏（多乐器）
      const totalBeats = notes.reduce((s, n) => s + n.duration, 0);
      const beatsPerBar = 4;
      const totalBars = Math.max(1, Math.ceil(totalBeats / beatsPerBar));
      const perInstVol = accompVol / Math.max(1, accompInsts.length) * 0.5; // 多乐器时降低每个乐器音量
      let barStart = startTime;
      for (let bar = 0; bar < totalBars; bar++) {
        const chordName = autoChords[bar % autoChords.length] || 'C';
        const chordNotes = CHORD_MAP[chordName] || CHORD_MAP['C'];
        const barBeats = Math.min(beatsPerBar, totalBeats - bar * beatsPerBar);
        const subdiv = styleCfg.subdivision;
        for (let beat = 0; beat < barBeats; beat++) {
          const beatStart = barStart + beat * beatDur;
          for (let sub = 0; sub < subdiv; sub++) {
            const subTime = beatStart + sub * (beatDur / subdiv);
            const dur = beatDur / subdiv * 0.85;
            let midiNotes;
            if (styleCfg.pattern === 'arpeggio') {
              const arp = [0,2,1,2];
              midiNotes = [chordNotes[arp[sub % 4]]];
            } else if (styleCfg.pattern === 'swing') {
              const sw = [0,1,2,1];
              midiNotes = [chordNotes[sw[sub % 4]]];
            } else {
              midiNotes = chordNotes;
            }
            let volScale = 1;
            if (styleCfg.pattern === 'accent' && beat % 2 === 1) volScale = 0.3;
            // 为每个选中的伴奏乐器创建声音
            accompInsts.forEach(instKey => {
              midiNotes.forEach(m => {
                const output = createInstrumentSound(audioCtx, instKey, midiToFreq(m), dur, subTime, perInstVol * volScale);
                if (output) output.connect(audioCtx.destination);
              });
            });
          }
          if (styleCfg.drum) {
            if (beat === 0 || beat === 2) createDrum(audioCtx, 'kick', beatStart, 0.3);
            if (beat === 1 || beat === 3) createDrum(audioCtx, 'snare', beatStart, 0.18);
            for (let h = 0; h < 2; h++) createDrum(audioCtx, 'hihat', beatStart + h * beatDur / 2, 0.06);
          }
        }
        barStart += beatsPerBar * beatDur;
      }

      // 人声
      if (vocalSource === 'user' && autoTunedBuffer) {
        const src = audioCtx.createBufferSource();
        src.buffer = autoTunedBuffer;
        const mixOut = createAutoMixChain(audioCtx, src);
        const vocalGain = audioCtx.createGain();
        vocalGain.gain.value = 0.85;
        mixOut.connect(vocalGain);
        vocalGain.connect(audioCtx.destination);
        src.start(startTime);
        activeSources.push(src);
      } else if (vocalSource === 'female' || vocalSource === 'male') {
        let vocalTimeOffset = 0;
        notes.forEach((note) => {
          const vocal = createVirtualVocal(audioCtx, vocalSource, midiToFreq(note.midi), note.duration * beatDur, startTime + vocalTimeOffset, 0.4);
          if (vocal) vocal.connect(audioCtx.destination);
          vocalTimeOffset += note.duration * beatDur;
        });
      } else if (autoTunedBuffer) {
        let vocalTimeOffset = 0;
        notes.forEach((note) => {
          const vocal = createVirtualVocal(audioCtx, 'female', midiToFreq(note.midi), note.duration * beatDur, startTime + vocalTimeOffset, 0.4);
          if (vocal) vocal.connect(audioCtx.destination);
          vocalTimeOffset += note.duration * beatDur;
        });
      }

      // 高亮
      const totalDur = totalBeats * beatDur;
      const hlInt = setInterval(() => {
        if (token !== playToken) { clearInterval(hlInt); return; }
        const elapsed = audioCtx.currentTime - startTime;
        let acc = 0, hlIdx = -1;
        for (let i = 0; i < notes.length; i++) {
          const d = notes[i].duration * beatDur;
          if (elapsed >= acc && elapsed < acc + d) { hlIdx = i; break; }
          acc += d;
        }
        if (hlIdx !== currentPlayingIndex) {
          currentPlayingIndex = hlIdx;
          draw();
          if (hlIdx >= 0) highlightChar(hlIdx);
        }
        document.getElementById('progressFill').style.width = Math.min((elapsed/totalDur)*100, 100) + '%';
        if (elapsed > totalDur + 1) {
          clearInterval(hlInt);
          currentPlayingIndex = -1;
          draw();
          clearHighlight();
          document.getElementById('progressFill').style.width = '0%';
        }
      }, 80);
      document.getElementById('status').textContent = '正在播放完整歌曲...';
    }

    // ==================== 歌词 ====================
    function buildSentences() {
      const text = document.getElementById('lyrics').value.trim();
      sentences = [];
      if (!text) return;
      const rawSentences = text.split(/[，。！？；、\n]+/).filter(s => s.trim().length > 0);
      let charIdx = 0;
      for (const raw of rawSentences) {
        const chars = raw.replace(/\s+/g, '').split('');
        if (chars.length === 0) continue;
        const s = charIdx;
        const e = charIdx + chars.length - 1;
        if (s < notes.length) {
          sentences.push({ startIndex: s, endIndex: Math.min(e, notes.length-1), text: chars.join('') });
        }
        charIdx += chars.length;
      }
      renderLyricsPreview();
    }
    function renderLyricsPreview() {
      const c = document.getElementById('lyricsPreview');
      if (!sentences.length) {
        c.innerHTML = '<p style="font-size:11px;color:rgba(148,163,184,0.6);">应用歌词后显示每句。</p>';
        return;
      }
      let html = '';
      sentences.forEach((s, idx) => {
        html += `<div class="sentence-item"><button class="sentence-btn" data-idx="${idx}">▶</button><span class="sentence-text">${s.text.split('').map((ch, i) => `<span data-idx="${s.startIndex + i}">${ch}</span>`).join('')}</span></div>`;
      });
      c.innerHTML = html;
      c.querySelectorAll('.sentence-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.idx);
          playNotesRange(sentences[idx].startIndex, sentences[idx].endIndex);
        });
      });
    }
    function syncLyricsChars() {
      const text = document.getElementById('lyrics').value.trim();
      if (text) {
        const allChars = [];
        const rawSentences = text.split(/[，。！？；、\n]+/).filter(s => s.trim().length > 0);
        for (const s of rawSentences) allChars.push(...s.replace(/\s+/g, '').split(''));
        lyricsChars = allChars.slice(0, notes.length);
      } else {
        lyricsChars = [];
      }
    }

    // ==================== 录音 ====================
    document.getElementById('startRecordBtn').addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        recordedChunks = [];
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          const blob = new Blob(recordedChunks, { type: 'audio/webm' });
          document.getElementById('recordStatus').textContent = '自动处理中...';
          try {
            await ensureAudioCtx();
            const arrayBuf = await blob.arrayBuffer();
            const audioBuf = await audioCtx.decodeAudioData(arrayBuf);
            const chData = audioBuf.getChannelData(0);
            await sleep(50);
            const denoised = spectralSubtraction(chData, 0.6);
            await sleep(50);
            let targetMidi = 69;
            if (notes.length > 0) {
              const midiSum = notes.reduce((s, n) => s + n.midi, 0);
              targetMidi = Math.round(midiSum / notes.length);
            }
            const tuned = autoTuneAudio(denoised, audioCtx.sampleRate, targetMidi, 40);
            autoTunedBuffer = audioCtx.createBuffer(1, tuned.length, audioCtx.sampleRate);
            autoTunedBuffer.copyToChannelData(tuned, 0);
            document.getElementById('recordStatus').textContent = '✅ 完成';
            document.getElementById('playRecordBtn').disabled = false;
            document.getElementById('vocalSource').value = 'user';
            stream.getTracks().forEach(t => t.stop());
          } catch (err) {
            document.getElementById('recordStatus').textContent = '失败';
            stream.getTracks().forEach(t => t.stop());
          }
        };
        mediaRecorder.start();
        document.getElementById('startRecordBtn').disabled = true;
        document.getElementById('stopRecordBtn').disabled = false;
        document.getElementById('playRecordBtn').disabled = true;
        document.getElementById('recordStatus').textContent = '录音中...';
      } catch (err) {
        alert('无法访问麦克风：' + err.message);
      }
    });
    document.getElementById('stopRecordBtn').addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        document.getElementById('startRecordBtn').disabled = false;
        document.getElementById('stopRecordBtn').disabled = true;
      }
    });
    document.getElementById('playRecordBtn').addEventListener('click', async () => {
      if (!autoTunedBuffer) return;
      await ensureAudioCtx();
      const src = audioCtx.createBufferSource();
      src.buffer = autoTunedBuffer;
      const mixOut = createAutoMixChain(audioCtx, src);
      mixOut.connect(audioCtx.destination);
      src.start();
    });

    // ==================== 事件绑定 ====================
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      const { x, y } = getPointerPos(e);
      const handleIdx = isOnResizeHandle(x, y);
      if (handleIdx >= 0) {
        isResizing = true; resizeNoteIndex = handleIdx;
        canvas.style.cursor = 'ew-resize';
        pushUndo();
        return;
      }
      const idx = findNoteAt(x, y);
      if (idx >= 0) {
        if (e.button === 2) {
          e.preventDefault();
          notes.splice(idx, 1); lyricsChars.splice(idx, 1);
          selectedNoteIndex = -1;
          pushUndo(); buildSentences(); resizeCanvas(); draw();
          return;
        }
        selectedNoteIndex = idx; isDragging = true;
        canvas.style.cursor = 'grabbing';
        pushUndo();
      } else {
        const tw = totalWidth();
        if (x > tw && x < canvas.width - 6) {
          notes.push({ midi: snapMidi(y), duration: 1 });
          lyricsChars.push('');
          selectedNoteIndex = notes.length - 1;
          isDragging = true;
          canvas.style.cursor = 'grabbing';
          pushUndo(); buildSentences(); resizeCanvas();
        } else {
          selectedNoteIndex = -1;
        }
      }
      draw();
    });
    canvas.addEventListener('pointermove', (e) => {
      e.preventDefault();
      const { x, y } = getPointerPos(e);
      if (isResizing && resizeNoteIndex >= 0) {
        const nx = noteX(resizeNoteIndex);
        let d = (x - nx) / DUR_PX;
        d = Math.round(d * 2) / 2;
        d = Math.max(0.5, Math.min(8, d));
        notes[resizeNoteIndex].duration = d;
        draw(); return;
      }
      if (isDragging && selectedNoteIndex >= 0) {
        notes[selectedNoteIndex].midi = snapMidi(y);
        draw(); return;
      }
      if (isOnResizeHandle(x, y) >= 0) canvas.style.cursor = 'ew-resize';
      else if (findNoteAt(x, y) >= 0) canvas.style.cursor = 'grab';
      else canvas.style.cursor = 'crosshair';
    });
    canvas.addEventListener('pointerup', () => {
      isDragging = false; isResizing = false; resizeNoteIndex = -1;
      canvas.style.cursor = 'crosshair';
    });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('dblclick', (e) => {
      const idx = findNoteAt(getPointerPos(e).x, getPointerPos(e).y);
      if (idx >= 0) {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        audioCtx.resume().then(() => {
          const out = createInstrumentSound(audioCtx, document.getElementById('melodyInstrument').value, midiToFreq(notes[idx].midi), 0.4, audioCtx.currentTime, 0.3);
          if (out) out.connect(audioCtx.destination);
        });
      }
    });

    function pushUndo() {
      undoStack.push(JSON.stringify(notes));
      if (undoStack.length > 50) undoStack.shift();
      document.getElementById('undoBtn').disabled = false;
    }
    document.getElementById('undoBtn').addEventListener('click', () => {
      if (undoStack.length === 0) return;
      notes = JSON.parse(undoStack.pop());
      selectedNoteIndex = -1;
      syncLyricsChars(); buildSentences(); resizeCanvas(); draw();
      document.getElementById('undoBtn').disabled = undoStack.length === 0;
    });

    document.getElementById('applyLyrics').addEventListener('click', () => {
      const text = document.getElementById('lyrics').value.trim();
      if (!text) return;
      const rawSentences = text.split(/[，。！？；、\n]+/).filter(s => s.trim().length > 0);
      let chars = [];
      for (const s of rawSentences) chars = chars.concat(s.replace(/\s+/g, '').split(''));
      if (chars.length === 0) return;
      pushUndo();
      notes = chars.map(() => ({ midi: 69, duration: 1 }));
      lyricsChars = chars;
      selectedNoteIndex = -1;
      buildSentences();
      renderLyricsPreview();
      resizeCanvas();
      draw();
      const endings = rawSentences.map(s => { const c = s.replace(/\s+/g, ''); return c.charAt(c.length-1); });
      let rhymeInfo = '';
      const seen = {};
      endings.forEach((ch, i) => {
        if (seen[ch]) rhymeInfo += `第${seen[ch]}句和第${i+1}句结尾字相同（${ch}）\n`;
        else seen[ch] = i + 1;
      });
      document.getElementById('info').textContent = `共${chars.length}字，生成${notes.length}音符。${rhymeInfo ? '\n' + rhymeInfo : ''}`;
    });

    document.getElementById('playBtn').addEventListener('click', async () => {
      if (notes.length === 0) return;
      await playNotesRange(0, notes.length - 1);
    });
    document.getElementById('stopBtn').addEventListener('click', () => {
      stopAllPlayback();
      document.getElementById('stopBtn').disabled = true;
    });
    document.getElementById('playFullBtn').addEventListener('click', () => {
      playFullSong();
      document.getElementById('stopBtn').disabled = false;
    });
    document.getElementById('clearBtn').addEventListener('click', () => {
      stopAllPlayback();
      pushUndo();
      notes = [];
      lyricsChars = [];
      selectedNoteIndex = -1;
      buildSentences(); resizeCanvas(); draw();
    });
    document.getElementById('bpm').addEventListener('input', function() {
      document.getElementById('bpmValue').textContent = this.value;
    });
    document.getElementById('accompVolume').addEventListener('input', function() {
      document.getElementById('accompVolumeValue').textContent = this.value;
    });

    // ==================== 全屏歌词 ====================
    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      if (!sentences.length) return;
      let html = '';
      sentences.forEach(s => {
        html += s.text.split('').map((ch, i) => `<span data-idx="${s.startIndex + i}">${ch}</span>`).join('');
        html += ' ';
      });
      document.getElementById('fullscreenLyrics').innerHTML = html;
      document.getElementById('fullscreenOverlay').classList.add('active');
      if (notes.length > 0) playFullSong();
    });
    document.getElementById('closeFullscreen').addEventListener('click', () => {
      document.getElementById('fullscreenOverlay').classList.remove('active');
      stopAllPlayback();
    });

    // ==================== 分享 ====================
    document.getElementById('shareBtn').addEventListener('click', () => {
      const data = {
        lyrics: document.getElementById('lyrics').value,
        notes, lyricsChars,
        melodyInstrument: document.getElementById('melodyInstrument').value,
        accompInstruments: selectedAccompInstruments,
        accompStyle: document.getElementById('accompStyle').value,
        accompVolume: document.getElementById('accompVolume').value,
        bpm: document.getElementById('bpm').value,
        vocalSource: document.getElementById('vocalSource').value,
      };
      const json = JSON.stringify(data);
      const encoded = encodeURIComponent(btoa(unescape(encodeURIComponent(json))));
      const link = window.location.href.split('#')[0] + '#song=' + encoded;
      document.getElementById('shareStatus').textContent = '✅ 已复制';
      navigator.clipboard.writeText(link).then(() => {
        document.getElementById('shareStatus').textContent = '✅ 链接已复制！';
      }).catch(() => {
        document.getElementById('shareStatus').textContent = '请手动复制';
      });
    });

    function loadSharedSong() {
      const hash = window.location.hash;
      if (!hash.startsWith('#song=')) return;
      try {
        const encoded = hash.substring(6);
        const json = decodeURIComponent(escape(atob(decodeURIComponent(encoded))));
        const data = JSON.parse(json);
        document.getElementById('lyrics').value = data.lyrics || '';
        notes = data.notes || [];
        lyricsChars = data.lyricsChars || [];
        if (data.melodyInstrument) document.getElementById('melodyInstrument').value = data.melodyInstrument;
        if (data.accompInstruments) {
          selectedAccompInstruments = data.accompInstruments;
          renderInstrumentCheckboxes();
        }
        if (data.accompStyle) document.getElementById('accompStyle').value = data.accompStyle;
        if (data.accompVolume !== undefined) {
          document.getElementById('accompVolume').value = data.accompVolume;
          document.getElementById('accompVolumeValue').textContent = data.accompVolume;
        }
        if (data.bpm !== undefined) {
          document.getElementById('bpm').value = data.bpm;
          document.getElementById('bpmValue').textContent = data.bpm;
        }
        if (data.vocalSource) document.getElementById('vocalSource').value = data.vocalSource;
        selectedNoteIndex = -1;
        buildSentences();
        renderLyricsPreview();
        resizeCanvas();
        draw();
        document.querySelectorAll('textarea, button, select, input').forEach(el => {
          if (!['playFullBtn', 'closeFullscreen'].includes(el.id)) el.style.display = 'none';
        });
        document.querySelector('.instrument-checkboxes').style.display = 'none';
        document.querySelector('.help').textContent = '🎵 分享播放模式（只读）';
        playFullSong();
      } catch (e) {
        console.error('分享链接解析失败', e);
      }
    }

    // ==================== 草稿 ====================
    function saveDraft() {
      const draft = {
        lyrics: document.getElementById('lyrics').value,
        notes, lyricsChars,
        melodyInstrument: document.getElementById('melodyInstrument').value,
        accompInstruments: selectedAccompInstruments,
        accompStyle: document.getElementById('accompStyle').value,
        accompVolume: document.getElementById('accompVolume').value,
        bpm: document.getElementById('bpm').value,
        vocalSource: document.getElementById('vocalSource').value,
      };
      localStorage.setItem('musiyou_draft', JSON.stringify(draft));
    }
    function loadDraft() {
      const draft = localStorage.getItem('musiyou_draft');
      if (!draft) return;
      try {
        const data = JSON.parse(draft);
        if (data.lyrics) document.getElementById('lyrics').value = data.lyrics;
        if (data.notes) { notes = data.notes; lyricsChars = data.lyricsChars || []; }
        if (data.melodyInstrument) document.getElementById('melodyInstrument').value = data.melodyInstrument;
        if (data.accompInstruments) {
          selectedAccompInstruments = data.accompInstruments;
          renderInstrumentCheckboxes();
        }
        if (data.accompStyle) document.getElementById('accompStyle').value = data.accompStyle;
        if (data.accompVolume !== undefined) {
          document.getElementById('accompVolume').value = data.accompVolume;
          document.getElementById('accompVolumeValue').textContent = data.accompVolume;
        }
        if (data.bpm !== undefined) {
          document.getElementById('bpm').value = data.bpm;
          document.getElementById('bpmValue').textContent = data.bpm;
        }
        if (data.vocalSource) document.getElementById('vocalSource').value = data.vocalSource;
        selectedNoteIndex = -1;
        buildSentences();
        renderLyricsPreview();
        resizeCanvas();
        draw();
        document.getElementById('info').textContent = '已恢复上次草稿';
      } catch (e) {}
    }
    setInterval(saveDraft, 30000);
    window.addEventListener('beforeunload', saveDraft);

    // ==================== 初始化 ====================
    function populateSelects() {
      const melodySel = document.getElementById('melodyInstrument');
      INSTRUMENT_KEYS.forEach(k => {
        const o = document.createElement('option');
        o.value = k; o.textContent = INSTRUMENTS[k].name;
        melodySel.appendChild(o);
      });
      melodySel.value = 'piano';
    }

    populateSelects();
    renderInstrumentCheckboxes();
    document.getElementById('bpmValue').textContent = document.getElementById('bpm').value;
    document.getElementById('accompVolumeValue').textContent = document.getElementById('accompVolume').value;
    loadDraft();
    resizeCanvas();
    draw();
    loadSharedSong();
  </script>
</body>
</html>
